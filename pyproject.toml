[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comovotam-legisdiff"
version = "1.0.0"
description = "Diff estrutural e semântico de textos legislativos brasileiros"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Como Votam" }]
keywords = ["legislativo", "lexml", "diff", "ast", "brasil", "técnica-legislativa"]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.16,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13",
  "lxml>=5.3",
]

[dependency-groups]
dev = ["ruff>=0.12", "mypy>=1.16", "types-beautifulsoup4"]

[project.scripts]
legisdiff = "legisdiff.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["legisdiff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer Argument/Option defaults

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
